submission:
  title: "ThreatIntel Correlator"      # REQUIRED

  problem_statement: >                 # REQUIRED
    Security Operations Centre analysts are overwhelmed by hundreds of noisy,
    uncorrelated alerts every shift, making it nearly impossible to identify genuine
    threats before attackers achieve their objectives. Manual triage is slow,
    error-prone, and leads to alert fatigue — causing real incidents to be missed
    or responded to too late.

  solution_summary: >                  # REQUIRED
    ThreatIntel Correlator is a Flask web application that automatically ingests
    multi-source threat alerts, scores and classifies each one with a transparent
    rule-based engine, correlates related alerts into incidents, maps techniques to
    MITRE ATT&CK, and generates a concise BLUF (Bottom Line Up Front) summary for
    every high-priority incident using IBM watsonx.ai — giving SOC analysts and
    commanders a single, prioritised view of what is actually happening.

  key_features:                        # REQUIRED — 3 to 5 specific features
    - "Transparent weighted-sum risk scoring (0-100) with per-factor breakdown (severity, event type, destination sensitivity, recurrence, keywords) visible in the UI — fully explainable, no black box"
    - "Automated alert correlation engine that groups related alerts into incidents by shared source IP and MITRE technique within a configurable time window"
    - "MITRE ATT&CK technique mapping via keyword-matching against a curated local lookup table (~25 techniques), with tactic heatmap visualisation on the MITRE Map page"
    - "IBM watsonx.ai BLUF generation using ibm/granite-13b-instruct-v2 with a deterministic template fallback when no API key is present — prototype is fully demoable offline"
    - "Deterministic false-positive detection with six heuristic rules (IP whitelist, known scanner CIDR, informational-recon filter, 60-second duplicate suppression, low-score filter) and a separate FP review queue"

  tech_stack:
    languages: ["Python", "HTML", "CSS", "JavaScript"]
    frameworks: ["Flask", "SQLAlchemy", "Flask-Migrate", "pandas", "Jinja2"]
    ibm_technologies: ["watsonx.ai", "ibm-watsonx-ai Python SDK", "IBM Bob"]
    databases: ["SQLite"]
    other: ["Chart.js", "pytest", "python-dotenv"]

  what_we_are_most_proud_of: >         # Optional but recommended
    We are most proud of the watsonx.ai BLUF generation combined with the
    explainable scoring engine. Every risk score can be decomposed into its five
    contributing factors directly in the UI, and every HIGH-priority incident gets
    a military-style Bottom Line Up Front summary generated by IBM Granite — giving
    a security commander an immediately actionable briefing without having to dig
    through raw alert tables. The graceful template fallback ensures the prototype
    is fully demoable even without a live watsonx API key.

  known_limitations: >                 # Optional but recommended
    This is a student-level prototype built for the hackathon. All alert data is
    synthetic and not sourced from real threat feeds. Live SIEM connectors
    (Splunk, QRadar) are stubbed out and not implemented. There is no user
    authentication or multi-tenancy. The SQLite database is not suitable for
    production-scale ingestion volumes. The scoring thresholds and FP heuristics
    were hand-tuned on the sample dataset and would need validation on real data.
    The watsonx BLUF prompt has not been red-teamed or optimised beyond basic
    functional testing.

